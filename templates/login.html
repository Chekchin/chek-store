<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CHEK Uploader</title>

    <!-- ត្រូវមានកូដនេះនៅចំទីនេះ -->
    <link rel="icon" type="image/png" href="/cheklogo.png" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: { 400: "#22d3ee", 500: "#06b6d4", 600: "#0891b2" },
              darkbg: "#0f172a",
              cardbg: "#1e293b",
            },
            fontFamily: { sans: ["Inter", "sans-serif"] },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-darkbg text-slate-100 font-sans min-h-screen flex items-center justify-center px-4 selection:bg-brand-500 selection:text-white"
  >
    <div
      class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6 relative overflow-hidden"
    >
      <!-- Glow effect -->
      <div
        class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"
      ></div>

      <!-- Header Logo -->
      <div class="text-center space-y-2">
        <div
          class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-brand-500 to-cyan-400 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-cyan-500/30"
        >
          CS
        </div>
        <h1
          class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-teal-300 to-sky-400 bg-clip-text text-transparent"
        >
          CHEK STORE UPLOADER
        </h1>
        <p class="text-xs text-slate-400">
          Please sign in to access your secure dashboard
        </p>
      </div>

      <!-- Error Message Box -->
      {% if error %}
      <div
        class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs px-4 py-3 rounded-xl flex items-center gap-2"
      >
        <i class="fa-solid fa-circle-exclamation text-base"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5"
            >USERNAME</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"
            >
              <i class="fa-solid fa-user"></i>
            </span>
            <input
              type="text"
              name="username"
              required
              placeholder="Enter your username"
              class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 outline-none transition-colors"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5"
            >PASSWORD</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"
            >
              <i class="fa-solid fa-lock"></i>
            </span>
            <input
              type="password"
              name="password"
              required
              placeholder="Enter your password"
              class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-200 outline-none transition-colors"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2 text-sm"
        >
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Telegram Support Link -->
      <div class="pt-4 border-t border-slate-800 text-center">
        <p class="text-xs text-slate-500">Having trouble accessing?</p>
        <a
          href="https://t.me/chinchek55"
          target="_blank"
          class="inline-flex items-center gap-2 mt-2 text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition-colors bg-cyan-500/10 border border-cyan-500/20 px-4 py-2 rounded-xl"
        >
          <i class="fa-brands fa-telegram text-base"></i>
          <span>Contact Admin on Telegram </span>
        </a>
      </div>
    </div>
  </body>
</html>
